name: Validate and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run check
      - run: python tests/package_test.py
      - name: Match release tag to manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "require('node:assert/strict').equal(process.env.RELEASE_TAG, 'v' + require('./extension/manifest.json').version)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-web-store-package
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/package.py
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            const {data: release} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `LinkedIn Lens ${tag}`,
              body: 'Chrome / Edge Manifest V3 release. Upload the chrome.zip file to the Chrome Web Store developer dashboard. See store/SUBMISSION.md for listing copy, privacy disclosures and review instructions. This release is not a Chrome Web Store approval.'
            });
            for (const name of fs.readdirSync('dist').sort()) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(`dist/${name}`)
              });
            }
